[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "soilclf"
version = "0.1.0"
description = "Reproducible soil image classification: data audit, leakage-free splits, classical baseline, MobileNetV2 transfer learning, TFLite compression and benchmarking."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Muhammad Syauqi Robbani" }]
dependencies = [
  "numpy>=1.26",
  "pandas>=2.0",
  "scikit-learn>=1.3",
  "scikit-image>=0.22",
  "opencv-python-headless>=4.9",
  "pillow>=10.0",
  "matplotlib>=3.7",
  "pyyaml>=6.0",
  "joblib>=1.3",
]

[project.optional-dependencies]
train = ["tensorflow>=2.16,<2.22"]
app = ["streamlit>=1.40,<2"]
dev = ["pytest>=7.4"]

[project.scripts]
soilclf = "soilclf.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
