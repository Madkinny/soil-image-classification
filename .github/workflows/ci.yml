name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        extras: ["dev", "train,dev"]
    name: tests (${{ matrix.extras }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[${{ matrix.extras }}]"
      - run: pytest -q -rs
